[project]
name = "prymer"
version = "1.0.0"
dependencies = [
    "numpy==2.5.0",
    "pandas==2.2.2",
    "primer3-py>=2.0.0",
    "requests==2.32.3",
    "urllib3==1.26.15"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
addopts = "--strict-markers"
markers = ["network: hits live UCSC API"]