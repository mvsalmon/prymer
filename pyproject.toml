[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prymer"
version = "0.1.0"
description = "Primer design package that can handle SVs using primer3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.2",
    "primer3-py>=2.0.0",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
prymer = "prymer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prymer = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts = "--strict-markers"
markers = ["network: hits live UCSC API"]